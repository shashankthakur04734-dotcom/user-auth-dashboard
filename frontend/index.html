<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Auth - Sign In</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen relative flex items-center justify-center overflow-x-hidden px-4">
    
    <!-- Animated background gradients -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-700/20 rounded-full blur-[128px]"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-700/20 rounded-full blur-[128px]"></div>
    
    <div class="w-full max-w-md glass-panel p-8 rounded-2xl animate-fade-in relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2 glow-text-indigo">
                Aether<span class="text-brand-500">Auth</span>
            </h1>
            <p class="text-slate-400 text-sm">Welcome back. Enter your credentials to access your portal.</p>
        </div>
        
        <!-- Form -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    placeholder="you@example.com" 
                    class="w-full px-4 py-3 rounded-lg text-sm text-white glass-input placeholder-slate-500 focus:outline-none"
                >
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    required 
                    placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-lg text-sm text-white glass-input placeholder-slate-500 focus:outline-none"
                >
            </div>
            
            <button 
                type="submit" 
                id="submitBtn" 
                class="w-full py-3 px-4 rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 glow-btn-indigo focus:outline-none transition-all flex justify-center items-center gap-2"
            >
                <span>Sign In</span>
                <!-- Loading Spinner (hidden by default) -->
                <svg id="spinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
        
        <!-- Footer links -->
        <div class="text-center mt-6">
            <p class="text-sm text-slate-400">
                Don't have an account? 
                <a href="register.html" class="text-brand-500 hover:text-brand-600 hover:underline font-semibold transition-all">Sign up</a>
            </p>
            <div class="mt-4 pt-4 border-t border-white/5 text-xs text-slate-500">
                <p>Demo Admin: <span class="text-slate-300">admin@example.com</span> / <span class="text-slate-300">adminpassword</span></p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // Guard route: if user is logged in, this will auto redirect to dashboard.html
            await checkAuth();

            const form = document.getElementById("loginForm");
            const submitBtn = document.getElementById("submitBtn");
            const spinner = document.getElementById("spinner");

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;

                // UI loading state
                submitBtn.disabled = true;
                spinner.classList.remove("hidden");

                try {
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.detail || "Authentication failed. Please check your credentials.");
                    }

                    // Store JWT token
                    setToken(data.access_token);
                    
                    showToast("Access granted. Redirecting to your dashboard...", "success");
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1200);

                } catch (error) {
                    showToast(error.message, "error");
                    submitBtn.disabled = false;
                    spinner.classList.add("hidden");
                }
            });
        });
    </script>
</body>
</html>
